name: tests

on:
  push:
    branches: [organize-web-enum-tools, main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

      # mypy baseline (TASK #50). Currently runs with continue-on-error
      # because GivEnum.py has ~16 baseline issues (mostly Path|None mass
      # refactor needed). The job stays visible so REGRESSIONS surface,
      # but doesn't block merges yet. Once the baseline is clean, flip
      # continue-on-error to false to make new errors a hard fail.
      - name: Run mypy
        continue-on-error: true
        run: |
          mypy GivEnum.py scan_runner.py tests \
            --no-incremental \
            --cache-dir=/tmp/mypy-cache

  web:
    name: vitest (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Type-check (next build skipped to save time)
        run: npx --no-install tsc --noEmit
